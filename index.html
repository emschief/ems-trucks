<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>EMS Trucks</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14202D">
<meta name="description" content="Maintenance tracking and fuel reports for the White Horse Fire &amp; EMS trucks.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: mobile app shell — sticky header, scrolling views, bottom tab bar with a centre "log service" button */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --sunk:#E3E8ED; --line:#D3DAE1;
  --fg:#14202D; --muted:#5A6878; --ink:#14202D; --on-ink:#F2F5F8;
  --accent:#C8102E; --on-accent:#FFFFFF; --amber:#9A620A; --amber-bg:#FDF1DC; --ok:#1E7A4B; --ok-bg:#E1F2E8; --bad-bg:#FBE3E6;
  --odo-bg:#14202D; --odo-fg:#F7F9FB;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0C131A; --surface:#151F29; --sunk:#1B2733; --line:#283646;
  --fg:#E5EAEF; --muted:#94A1AF; --ink:#060B10; --on-ink:#F2F5F8;
  --accent:#FF4A5C; --on-accent:#16070A; --amber:#F2B744; --amber-bg:#3A2C10; --ok:#4FC98A; --ok-bg:#12301F; --bad-bg:#3B151B;
  --odo-bg:#05090D; --odo-fg:#F2F5F8; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (display-mode:standalone){body{overscroll-behavior-y:none;-webkit-user-select:none;user-select:none} input,textarea,select{-webkit-user-select:text;user-select:text}}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--on-ink);padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.mark{width:32px;height:32px;flex:none;border-radius:7px;background:#fff;overflow:hidden}
.mark img{width:100%;height:100%;display:block}
.brand{font:700 21px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font:500 12px/1.2 var(--body);letter-spacing:0;text-transform:none;opacity:.7;margin-top:3px}
.spacer{flex:1}
.refresh{border:0;background:rgba(255,255,255,.1);color:var(--on-ink);border-radius:8px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
.refresh svg{width:20px;height:20px}
.refresh.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding-block:18px 130px}
h1.view{font:700 26px/1.1 var(--display);letter-spacing:.02em;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px}
.label{font:600 12px/1 var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.odo{display:inline-flex;gap:2px;padding:4px;border-radius:6px;background:var(--odo-bg)}
.odo span{font:700 17px/1 var(--mono);color:var(--odo-fg);width:1.05em;text-align:center;padding:5px 0;border-radius:3px;background:rgba(255,255,255,.07)}
.odo span.tenth{background:#C8102E;color:#fff}

.trucks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.truck{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0}
.photo{aspect-ratio:16/9;max-width:100%;width:100%;background:var(--sunk);display:grid;place-items:center;overflow:hidden;position:relative}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo img:not([src]){display:none}
.photo .ph{font:700 44px/1 var(--display);color:var(--muted);letter-spacing:.04em;opacity:.55}
.truck .body{padding:14px;display:grid;gap:12px}
.tname{font:700 22px/1 var(--display);letter-spacing:.02em}
.meta{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .v{font:700 20px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 12px/1 var(--body);padding:5px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.warn{background:var(--amber-bg);color:var(--amber)}
.chip.bad{background:var(--bad-bg);color:var(--accent)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.group-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:14px 4px 8px}
.group-h h2{font:700 18px/1 var(--display);letter-spacing:.03em;margin:0}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.item:first-child{border-top:0}
.item:active{background:var(--sunk)}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--muted)}
.item .r{text-align:right;flex:none}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
@media (max-width:480px){th,td{padding:10px 8px}th:first-child,td:first-child{padding-left:12px}th:last-child,td:last-child{padding-right:12px}.hide-sm{display:none}}
th,td{padding:10px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
th{font:600 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:0;background:var(--sunk)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.seg{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.seg[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 6px 18px rgba(0,0,0,.25);border-radius:999px;padding:0 18px;min-height:52px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-block:6px}
.tab{border:0;background:none;display:grid;justify-items:center;gap:3px;padding:6px 2px;cursor:pointer;color:var(--muted);font:600 11px/1 var(--body)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab.center .disc{width:50px;height:50px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-top:-22px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.tab.center .disc svg{width:26px;height:26px}

.scrim{position:fixed;inset:0;z-index:20;background:rgba(6,11,16,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:94%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:88%}}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet header h2{font:700 21px/1 var(--display);letter-spacing:.03em;margin:0;flex:1}
.sheet .content{overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.sheet footer{display:flex;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.sheet footer .btn{flex:1}
.x{border:0;background:none;cursor:pointer;padding:6px;color:var(--muted)}
.field{display:grid;gap:6px}
.field>label:not(.btn){font:600 13px/1 var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field>label .req{color:var(--accent)}
.field input[type=radio]{width:auto;min-height:0;padding:0}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--on-accent)}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-height:46px}
.field textarea{min-height:84px;resize:vertical}
.field input.big{font:700 22px/1 var(--mono)}
.hint{font-size:13px;color:var(--muted)}
.hint.warn{color:var(--amber)}
.err{font-size:14px;color:var(--accent);font-weight:600}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.confirm{background:var(--bad-bg);border-radius:8px;padding:12px;display:grid;gap:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--sunk)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px)}

.hero{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.hero .body{padding:16px;display:grid;gap:14px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kv .k{font-size:12px;color:var(--muted)}
.kv .v{font-weight:600;word-break:break-all}
.back{border:0;background:none;color:var(--muted);font-weight:600;cursor:pointer;padding:4px 0;margin-bottom:8px}
.stack{display:grid;gap:18px}
.stack>*{min-width:0}

.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0}
.item.static{cursor:default}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.clipn{display:inline-flex;gap:3px;align-items:center;justify-content:flex-end}
.clipn svg{width:14px;height:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 4px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font:700 22px/1.2 var(--mono)}
@media (max-width:380px){.kpi .v{font-size:18px}}
tr.link{cursor:pointer}
tr.total td{font-weight:700;background:var(--sunk)}
td .bar{display:inline-block;vertical-align:middle;height:8px;width:calc(var(--w) * .6);max-width:60px;border-radius:2px;background:var(--accent);opacity:.55;margin-right:8px}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:4px;margin-bottom:10px}
.seg2 button{border:0;background:none;border-radius:7px;padding:10px;font-weight:700;cursor:pointer;color:var(--muted);display:flex;gap:6px;justify-content:center;align-items:center}
.seg2 button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.prose{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.atts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.att{position:relative}
.att-open{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0;overflow:hidden;cursor:pointer;display:grid;text-align:left}
.att-open img,.att-doc{width:100%;aspect-ratio:1;object-fit:cover;background:var(--sunk);display:grid;place-items:center;align-content:center;gap:4px;color:var(--muted)}
.att-doc svg{width:30px;height:30px}
.att-doc b{font:700 11px/1 var(--mono)}
.att-name{font-size:12px;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(6,11,16,.7);color:#fff;display:grid;place-items:center;cursor:pointer}
.att-x svg{width:14px;height:14px}
.attach-btn{position:relative;overflow:hidden;justify-self:start}
.attach-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:100px}
.viewer{display:grid;gap:10px}
.viewer img{width:100%;border-radius:8px;background:var(--sunk)}
.viewer iframe{width:100%;height:65vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.viewer .empty svg{width:40px;height:40px}
.x svg{width:22px;height:22px}

/* PIN gate */
.gate{min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--on-ink);padding:24px max(16px,env(safe-area-inset-left,0px))}
.gate .box{width:100%;max-width:340px;display:grid;gap:18px;text-align:center}
.gate .mark{width:72px;height:72px;border-radius:16px;margin:0 auto}
.gate h1{font:700 32px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;margin:0}
.gate p{margin:0;opacity:.75}
.gate input{width:100%;text-align:center;font:700 30px/1 var(--mono);letter-spacing:.3em;padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff}
.gate .btn.primary{background:#C8102E;border-color:#C8102E;color:#fff;min-height:52px;font-size:17px}
.gate .err{color:#FF8A96}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

/* Inside the Google Sites frame: one-screen layout, tabs under the header so they never fall below the fold */
.embedded,.embedded body{height:100%;overflow:hidden}
.embedded #app:not([hidden]){display:flex;flex-direction:column;height:100%;position:relative}
.embedded header.top{position:static;flex:none}
.embedded nav.tabs{position:static;flex:none;order:0;border-top:0;border-bottom:1px solid var(--line);padding-bottom:0}
.embedded main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;order:1;padding-block:16px 96px}
.embedded nav.tabs .wrap{align-items:center;padding-block:4px}
.embedded .tab.center .disc{width:34px;height:34px;margin-top:0;box-shadow:none}
.embedded .tab.center .disc svg{width:20px;height:20px}
.embedded .fab{position:absolute;bottom:16px}
.embedded .gate{min-height:100%;height:100%}
.embedded .toast{bottom:84px}
</style>
</head>
<body>

<section class="gate" id="gate" hidden>
  <form class="box" id="gateForm" autocomplete="off">
    <div class="mark" aria-hidden="true"><img src="https://emschief.github.io/ems-trucks/icon-192.png" alt=""></div>
    <h1>EMS Trucks</h1>
    <p>Enter the station PIN to track truck maintenance.</p>
    <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="10" aria-label="Station PIN" placeholder="••••••">
    <div class="err" id="gateErr" hidden></div>
    <button class="btn primary" type="submit" id="gateBtn">Unlock</button>
  </form>
</section>

<div id="app" hidden>
<header class="top">
  <div class="wrap">
    <div class="mark" aria-hidden="true"><img src="https://emschief.github.io/ems-trucks/icon-192.png" alt=""></div>
    <div class="brand">EMS Trucks<small id="whoami">Maintenance</small></div>
    <div class="spacer"></div>
    <button class="refresh" id="refreshBtn" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
  </div>
</header>

<main><div class="wrap" id="view"></div></main>
<button class="btn primary fab" id="fab" hidden></button>

<nav class="tabs" aria-label="Sections">
  <div class="wrap">
    <button class="tab" data-tab="trucks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M2 16V7h11v9M13 10h4l4 4v2h-8"/><circle cx="6.5" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>Trucks</button>
    <button class="tab" data-tab="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</button>
    <button class="tab center" data-tab="logService" aria-label="Log service"><span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Log Service</button>
    <button class="tab" data-tab="maint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>Maintenance</button>
    <button class="tab" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>More</button>
  </div>
</nav>
</div>

<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>

  if(IN_GAS) return new Promise(function(res,rej){ var r=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){ rej(e); }); r[fn].apply(r,args); });

    .then(function(r){ if(!r.ok) throw new Error("Couldn't reach the sheet. Check your signal and try again."); return r.json(); })

function msg(e){ var m=(e&&e.message)||String(e||""); return m.replace(/^Exception:\s*/,"").replace(/^Error:\s*/,"") || "Something went wrong. Try again."; }

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s);}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return String(n).padStart(2,"0");}
function toDate(s){ if(!s) return null; var d=new Date(s.length===10?s+"T00:00:00":s); return isNaN(d)?null:d; }
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function localStamp(d){return ymd(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());}
function fmtDate(s){var d=toDate(s);return d?d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):"";}
function fmtDT(s){var d=toDate(s);return d?d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" · "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}):"";}
function monthLabel(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});}
function n0(v){return (v==null||v==="")?"—":Number(v).toLocaleString(undefined,{maximumFractionDigits:0});}
function n1(v){return (v==null||v==="")?"—":Number(v).toLocaleString(undefined,{maximumFractionDigits:1});}
function truckById(id){return S.trucks.filter(function(t){return t.id===id;})[0];}
function truckName(id){var t=truckById(id);return t?t.name:(id||"—");}
function initials(name){var w=(name||"").replace(/[()]/g,"").split(/\s+/).filter(Boolean);var l=w[w.length-1]||"EMS";return l.slice(0,3).toUpperCase();}
function isAdmin(){return S.role==="admin";}
function toast(m){var h=$("#toastHost");h.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(function(){h.innerHTML="";},2800);}
function odo(v){ if(v==null||v==="") return '<span class="odo" aria-label="No reading"><span>-</span><span>-</span><span>-</span></span>';
  var n=Number(v),w=Math.floor(n),t=Math.round((n-w)*10)%10; var d=String(w).padStart(6,"0").split("");
  return '<span class="odo" aria-label="'+n1(n)+' miles">'+d.map(function(x){return "<span>"+x+"</span>";}).join("")+'<span class="tenth">'+t+'</span></span>'; }
function photoImg(path,alt){ return path?'<img data-photo="'+esc(path)+'" alt="'+esc(alt||"")+'">':""; }
function hydratePhotos(){
  document.querySelectorAll("img[data-photo]:not([src])").forEach(function(img){
    var p=img.getAttribute("data-photo");
    if(photoCache[p]){ img.src=photoCache[p]; return; }
    if(photoCache[p]===""||photoPending[p]) return;
    photoPending[p]=1;
    api("getPhoto",S.pin,p).then(function(url){ photoCache[p]=url||""; delete photoPending[p];
      document.querySelectorAll('img[data-photo]').forEach(function(i){ if(i.getAttribute("data-photo")===p&&url) i.src=url; }); })
      .catch(function(){ delete photoPending[p]; photoTries[p]=(photoTries[p]||0)+1; if(photoTries[p]>=2) photoCache[p]=""; else setTimeout(hydratePhotos,1500); });
  });
}

/* ---------- computed values ---------- */
function fuelFor(tid){return S.fuel.filter(function(f){return f.truck===tid&&f.odo!=null;}).sort(function(a,b){return a.ts<b.ts?-1:1;});}
function lastFill(tid){var r=fuelFor(tid);return r.length?r[r.length-1]:null;}
function lastOdo(tid){var r=fuelFor(tid);return r.length?r[r.length-1].odo:null;}
/* Current odometer: the highest reading from fill-ups or service records. */
function maxOdo(tid){ var o=fuelFor(tid).map(function(x){return x.odo;}).concat(S.maint.filter(function(m){return m.truck===tid&&m.odo!=null;}).map(function(m){return m.odo;}));
  return o.length?Math.max.apply(null,o):null; }
/* Miles for a period = highest odometer in the period minus the highest reading before it
   (or the period's lowest reading when there is nothing earlier). Same rule the AppSheet app used. */
function periodStats(tid,keyLen){ var r=fuelFor(tid), keys=[], out={};
  r.forEach(function(x){var k=x.ts.slice(0,keyLen); if(keys.indexOf(k)<0) keys.push(k);});
  var all=S.fuel.filter(function(f){return f.truck===tid;});
  all.forEach(function(x){var k=x.ts.slice(0,keyLen); if(keys.indexOf(k)<0) keys.push(k);});
  keys.forEach(function(k){ var inP=r.filter(function(x){return x.ts.slice(0,keyLen)===k;});
    var gal=all.filter(function(x){return x.ts.slice(0,keyLen)===k;}).reduce(function(s,x){return s+(+x.gal||0);},0);
    var fills=all.filter(function(x){return x.ts.slice(0,keyLen)===k;}).length;
    if(!inP.length){ out[k]={miles:0,gal:gal,fills:fills,mpg:null}; return; } var first=inP[0].ts;
    var before=r.filter(function(x){return x.ts<first;}); var hi=Math.max.apply(null,inP.map(function(x){return x.odo;}));
    var base=before.length?Math.max.apply(null,before.map(function(x){return x.odo;})):inP[0].odo;
    var miles=Math.max(0,hi-base);
    out[k]={miles:miles,gal:gal,fills:fills,mpg:gal>0&&miles>0?miles/gal:null}; });
  return out; }
function yearStats(tid){ var y=String(new Date().getFullYear()); return periodStats(tid,4)[y]||{miles:0,gal:0,fills:0,mpg:null}; }

/* Upcoming: the newest record of each service type per truck carries the reminder, so an
   older reminder drops off once that service is logged again. */
function scheduled(){ var latest={};
  S.maint.forEach(function(m){ var k=m.truck+"|"+(m.type||"").toLowerCase(); var c=latest[k]; if(!c||m.date>c.date) latest[k]=m; });
  return Object.keys(latest).map(function(k){return latest[k];}).filter(function(m){ return (m.nextBy==="Date"&&m.nextDate)||(m.nextBy==="Mileage"&&m.nextMiles!=null); })
    .map(dueInfo).sort(function(a,b){return a.rank-b.rank||a.sort-b.sort;}); }
function dueInfo(m){ var today=new Date(); today.setHours(0,0,0,0);
  if(m.nextBy==="Date"){ var d=toDate(m.nextDate), days=Math.round((d-today)/864e5);
    var st=days<0?"overdue":days<=15?"soon":"ok";
    var txt=days<0?Math.abs(days)+" day"+(Math.abs(days)===1?"":"s")+" overdue":days===0?"Due today":"In "+days+" day"+(days===1?"":"s");
    return {m:m,status:st,rank:{overdue:0,soon:1,ok:2}[st],sort:days,when:fmtDate(m.nextDate),left:txt}; }
  var cur=maxOdo(m.truck), left=cur==null?null:Number(m.nextMiles)-cur;
  var st2=left==null?"ok":left<0?"overdue":left<=500?"soon":"ok";
  return {m:m,status:st2,rank:{overdue:0,soon:1,ok:2}[st2],sort:left==null?1e9:left/30,when:"at "+n0(m.nextMiles)+" mi",
    left:left==null?"No odometer yet":left<0?n0(-left)+" mi overdue":n0(left)+" mi to go"}; }
function dueFor(tid){ return scheduled().filter(function(x){return x.m.truck===tid;}); }
function dueCount(tid){ return dueFor(tid).filter(function(x){return x.status!=="ok";}).length; }
function dueChip(x){ return '<span class="chip '+(x.status==="overdue"?"bad":x.status==="soon"?"warn":"")+'">'+(x.status==="overdue"?"Overdue":x.status==="soon"?"Due soon":"Scheduled")+'</span>'; }

function regChip(t){ if(!t.regExp) return '<span class="chip">No registration date</span>';
  var d=toDate(t.regExp),today=new Date(); today.setHours(0,0,0,0); var days=Math.round((d-today)/864e5);
  if(days<0) return '<span class="chip bad">Registration expired '+fmtDate(t.regExp)+'</span>';
  if(days<=60) return '<span class="chip warn">Registration due '+fmtDate(t.regExp)+'</span>';
  return '<span class="chip ok">Reg. good to '+fmtDate(t.regExp)+'</span>'; }

/* Attachments: the sheet keeps a Drive path per file. */
function attName(p){ var n=String(p).split("/").pop(); var m=/^Attach\.\d{8}-\d{6}\.(.+)$/.exec(n); if(m) return m[1];
  if(/^(Photo|Truck)\.[\d-]+\.\w+$/.test(n)||/\.(Photo|Attachments|Truck Image)\.\d+\.\w+$/.test(n)||/^[0-9a-f]{8}\.\w+$/i.test(n)) return "Photo"; return n; }
function attExt(p){ var m=/\.([a-z0-9]+)$/i.exec(String(p)); return m?m[1].toLowerCase():""; }
function isImg(p){ return ["jpg","jpeg","png","gif","webp","heic","heif"].indexOf(attExt(p))>=0; }
function attLabel(n){ return n+" attachment"+(n===1?"":"s"); }
function attTile(p,removable){ var name=attName(p);
  return '<div class="att"><button type="button" class="att-open" data-open-att="'+esc(p)+'" aria-label="Open '+esc(name)+'">'+
    (isImg(p)?'<img data-photo="'+esc(p)+'" alt="">':'<span class="att-doc">'+icon("doc")+'<b>'+esc(attExt(p).toUpperCase()||"FILE")+'</b></span>')+
    '<span class="att-name">'+esc(name)+'</span></button>'+
    (removable?'<button type="button" class="att-x" data-remove-att="'+esc(p)+'" aria-label="Remove '+esc(name)+'">'+icon("x")+'</button>':'')+'</div>'; }

function icon(n){return {plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  wrench:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>',
  clip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'}[n]||"";}

/* ---------- views ---------- */
function render(){
  var v=$("#view");
  document.querySelectorAll(".tab").forEach(function(b){ var tab=b.dataset.tab;
    var cur=tab===S.view||(tab==="trucks"&&S.view==="truck")||(tab==="more"&&["users","settings"].indexOf(S.view)>=0);
    if(cur) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  $("#whoami").textContent=isAdmin()?"Admin":"Crew";
  var fab=$("#fab"); fab.hidden=true;
  if(!S.loaded){ v.innerHTML='<h1 class="view">Trucks</h1><div class="panel"><div class="empty">Loading from the sheet…</div></div>'; return; }
  var views={trucks:viewTrucks,truck:viewTruck,reports:viewReports,maint:viewMaint,more:viewMore,users:viewUsers,settings:viewSettings};
  (views[S.view]||viewTrucks)(v,fab);
  hydratePhotos();
}
function chips(attr,cur,allLabel){ return '<div class="filters" role="group" aria-label="Choose a truck"><button class="seg" '+attr+'="all" aria-pressed="'+(cur==="all")+'">'+allLabel+'</button>'+
  sortedTrucks().map(function(t){return '<button class="seg" '+attr+'="'+esc(t.id)+'" aria-pressed="'+(cur===t.id)+'">'+esc(t.name)+'</button>';}).join("")+'</div>'; }
function sortedTrucks(){ return S.trucks.slice().sort(function(a,b){return (a.truckId||0)-(b.truckId||0);}); }

function viewTrucks(v,fab){
  var list=sortedTrucks(), yr=new Date().getFullYear();
  v.innerHTML='<h1 class="view">Trucks</h1><p class="sub">'+list.length+' vehicles · tap a truck for its full record</p>'+
  (list.length?'<div class="trucks">'+list.map(function(t){ var y=yearStats(t.id), u=dueCount(t.id);
    return '<button class="truck" data-open-truck="'+esc(t.id)+'"><div class="photo"><span class="ph">'+esc(initials(t.name))+'</span>'+photoImg(t.image,"")+'</div>'+
      '<div class="body"><div class="row"><div class="grow"><div class="tname">'+esc(t.name)+'</div><div class="meta">'+esc(t.plate||"No plate")+'</div></div>'+(u?'<span class="chip warn">'+u+' service due</span>':'')+'</div>'+
      '<div><div class="label" style="margin-bottom:6px">Odometer</div>'+odo(maxOdo(t.id))+'</div>'+
      '<div class="stats"><div class="stat"><div class="v">'+n0(y.miles)+'</div><div class="k">Miles in '+yr+'</div></div><div class="stat"><div class="v">'+n0(y.gal)+'</div><div class="k">Gallons in '+yr+'</div></div></div>'+
      '<div>'+regChip(t)+'</div></div></button>'; }).join("")+'</div>':'<div class="panel"><div class="empty">No trucks in the sheet yet.</div></div>');
  if(isAdmin()){ fab.hidden=false; fab.innerHTML=icon("plus")+"Add truck"; fab.onclick=function(){truckForm();}; }
}

function viewTruck(v){
  var t=truckById(S.param); if(!t){ go("trucks"); return; }
  var yr=new Date().getFullYear(), y=yearStats(t.id), lf=lastFill(t.id), due=dueFor(t.id);
  var months=periodStats(t.id,7), mk=Object.keys(months).sort().reverse().slice(0,6);
  var ml=S.maint.filter(function(m){return m.truck===t.id;}).sort(function(a,b){return a.date<b.date?1:-1;});
  var fills=fuelFor(t.id).reverse().slice(0,5);
  v.innerHTML='<button class="back" data-go="trucks">‹ All trucks</button><div class="stack">'+
  '<div class="hero"><div class="photo"><span class="ph">'+esc(initials(t.name))+'</span>'+photoImg(t.image,t.name)+'</div><div class="body">'+
    '<div class="row"><div class="grow"><h1 class="view">'+esc(t.name)+'</h1><div class="meta">'+esc(t.plate||"No plate")+'</div></div>'+(isAdmin()?'<button class="btn" data-edit-truck="'+esc(t.id)+'">Edit</button>':'')+'</div>'+
    '<div class="row"><button class="btn primary" data-add-maint="'+esc(t.id)+'">'+icon("wrench")+'Log service</button><button class="btn" data-report="'+esc(t.id)+'">'+icon("chart")+'Fuel report</button></div>'+
    '<div><div class="label" style="margin-bottom:6px">Odometer</div>'+odo(maxOdo(t.id))+(lf?'<div class="hint" style="margin-top:6px">Last fill-up '+esc(fmtDT(lf.ts))+(lf.driver?" · "+esc(lf.driver):"")+'</div>':'')+'</div>'+
    '<div>'+regChip(t)+'</div>'+
    '<div class="kv"><div><div class="k">Miles in '+yr+'</div><div class="v num">'+n0(y.miles)+'</div></div><div><div class="k">Gallons in '+yr+'</div><div class="v num">'+n0(y.gal)+'</div></div>'+
    '<div><div class="k">MPG in '+yr+'</div><div class="v num">'+(y.mpg?y.mpg.toFixed(1):"—")+'</div></div><div><div class="k">Fill-ups in '+yr+'</div><div class="v num">'+n0(y.fills)+'</div></div>'+
    '<div><div class="k">License plate</div><div class="v">'+esc(t.plate||"—")+'</div></div><div><div class="k">VIN</div><div class="v num">'+esc(t.vin||"—")+'</div></div>'+
    '<div><div class="k">Registration expires</div><div class="v">'+(t.regExp?fmtDate(t.regExp):"—")+'</div></div><div><div class="k">Truck ID</div><div class="v num">'+esc(t.truckId==null?"—":t.truckId)+'</div></div></div>'+
  '</div></div>'+
  '<section><div class="group-h"><h2>Upcoming service</h2><span class="label">'+due.length+'</span></div><div class="panel">'+(due.length?due.map(dueItem).join(""):'<div class="empty">Nothing scheduled. Set a next service when you log maintenance.</div>')+'</div></section>'+
  '<section><div class="group-h"><h2>Recent months</h2><button class="linkbtn" data-report="'+esc(t.id)+'">Full report ›</button></div><div class="panel tablewrap">'+
    (mk.length?'<table><thead><tr><th>Month</th><th class="n">Miles</th><th class="n">Gallons</th><th class="n">MPG</th></tr></thead><tbody>'+
     mk.map(function(k){var r=months[k];return '<tr><td>'+esc(monthLabel(k))+'</td><td class="n">'+n0(r.miles)+'</td><td class="n">'+n1(r.gal)+'</td><td class="n">'+(r.mpg?r.mpg.toFixed(1):"—")+'</td></tr>';}).join("")+'</tbody></table>'
     :'<div class="empty">No fill-ups from the Google Form yet.</div>')+'</div></section>'+
  '<section><div class="group-h"><h2>Maintenance history</h2><span class="label">'+ml.length+'</span></div><div class="panel">'+(ml.length?ml.map(function(m){return maintItem(m);}).join(""):'<div class="empty">No maintenance recorded.</div>')+'</div></section>'+
  '<section><div class="group-h"><h2>Latest fill-ups</h2><span class="label">From the Google Form</span></div><div class="panel">'+(fills.length?fills.map(fuelItem).join(""):'<div class="empty">No fill-ups yet.</div>')+'</div></section>'+
  '</div>';
}
function fuelItem(f){ var tag=isAdmin()?'button class="item" data-edit-fuel="'+esc(f.id)+'"':'div class="item static"';
  return '<'+tag+'><div class="grow"><div class="t">'+esc(fmtDT(f.ts))+'</div><div class="s">'+esc(f.driver||truckName(f.truck))+'</div></div>'+
  '<div class="r"><div class="num t">'+n1(f.odo)+' mi</div><div class="s num">'+n1(f.gal)+' gal</div></div></'+tag.split(" ")[0]+'>'; }
function maintItem(m,showTruck){ var n=(m.photos||[]).length;
  return '<button class="item" data-view-maint="'+esc(m.id)+'"><div class="grow"><div class="t">'+esc(m.type||"Service")+(showTruck?' · '+esc(truckName(m.truck)):'')+'</div>'+
  '<div class="s">'+esc(fmtDate(m.date))+(m.provider?' · '+esc(m.provider):'')+'</div>'+(m.work?'<div class="s clamp">'+esc(m.work)+'</div>':'')+'</div>'+
  '<div class="r"><div class="num s">'+n0(m.odo)+' mi</div>'+(n?'<div class="s clipn">'+icon("clip")+n+'</div>':'')+'</div></button>'; }
function dueItem(x,showTruck){ var m=x.m;
  return '<button class="item" data-view-maint="'+esc(m.id)+'"><div class="grow"><div class="t">'+esc(m.type||"Service")+(showTruck?' · '+esc(truckName(m.truck)):'')+'</div>'+
  '<div class="s">Due '+esc(x.when)+' · '+esc(x.left)+'</div><div class="s">Last done '+esc(fmtDate(m.date))+' at '+n0(m.odo)+' mi</div></div><div class="r">'+dueChip(x)+'</div></button>'; }

function viewReports(v){
  var tid=S.rTruck, mode=S.rMode, yr=new Date().getFullYear();
  var trucks=tid==="all"?sortedTrucks():[truckById(tid)].filter(Boolean);
  var keyLen=mode==="year"?4:7, data={};
  trucks.forEach(function(t){ data[t.id]=periodStats(t.id,keyLen); });
  var keys=[]; trucks.forEach(function(t){ Object.keys(data[t.id]).forEach(function(k){ if(keys.indexOf(k)<0) keys.push(k); }); }); keys.sort().reverse();
  var label=function(k){return mode==="year"?k:monthLabel(k);};
  var tot=trucks.reduce(function(s,t){var y=periodStats(t.id,4)[String(yr)]; if(y){s.miles+=y.miles;s.gal+=y.gal;} return s;},{miles:0,gal:0});
  var html='<h1 class="view">Reports</h1><p class="sub">Fuel and miles from the Google Form, '+(mode==="year"?"by year":"by month")+'</p>'+
    chips("data-r-truck",tid,"All trucks")+
    '<div class="filters" role="group" aria-label="Period"><button class="seg" data-r-mode="month" aria-pressed="'+(mode==="month")+'">By month</button><button class="seg" data-r-mode="year" aria-pressed="'+(mode==="year")+'">By year</button></div>'+
    '<div class="kpis"><div class="kpi"><div class="k">Miles in '+yr+'</div><div class="v num">'+n0(tot.miles)+'</div></div><div class="kpi"><div class="k">Gallons in '+yr+'</div><div class="v num">'+n0(tot.gal)+'</div></div>'+
    '<div class="kpi"><div class="k">MPG in '+yr+'</div><div class="v num">'+(tot.gal>0&&tot.miles>0?(tot.miles/tot.gal).toFixed(1):"—")+'</div></div></div>';
  if(!keys.length){ v.innerHTML=html+'<div class="panel"><div class="empty">No fill-ups from the Google Form yet.</div></div>'; return; }
  if(tid==="all"){
    html+=keys.map(function(k){ var rows=trucks.map(function(t){return {t:t,r:data[t.id][k]};}).filter(function(x){return x.r;});
      var tm=rows.reduce(function(s,x){return s+x.r.miles;},0), tg=rows.reduce(function(s,x){return s+x.r.gal;},0);
      return '<section><div class="group-h"><h2>'+esc(label(k))+'</h2><span class="label num">'+n0(tm)+' mi · '+n0(tg)+' gal</span></div><div class="panel tablewrap"><table><thead><tr><th>Truck</th><th class="n">Miles</th><th class="n">Gallons</th><th class="n">MPG</th></tr></thead><tbody>'+
        rows.map(function(x){return '<tr data-report="'+esc(x.t.id)+'" class="link"><td>'+esc(x.t.name)+'</td><td class="n">'+n0(x.r.miles)+'</td><td class="n">'+n1(x.r.gal)+'</td><td class="n">'+(x.r.mpg?x.r.mpg.toFixed(1):"—")+'</td></tr>';}).join("")+
        (rows.length>1?'<tr class="total"><td>All trucks</td><td class="n">'+n0(tm)+'</td><td class="n">'+n1(tg)+'</td><td class="n">'+(tg>0&&tm>0?(tm/tg).toFixed(1):"—")+'</td></tr>':'')+'</tbody></table></div></section>'; }).join("");
  } else {
    var d=data[tid], max=Math.max.apply(null,keys.map(function(k){return d[k].miles;}).concat([1]));

      var by=(form.querySelector("[name=nextBy]:checked")||{}).value||"";
      if(by==="Date"&&!form.nextDate.value) return "Enter the next service date, or choose None.";
      if(by==="Mileage"&&form.nextMiles.value==="") return "Enter the next service mileage, or choose None."; return ""; },
    onSave:function(form){ var type=form.type.value; if(type==="Other"&&form.other.value.trim()) type=form.other.value.trim();
      var by=(form.querySelector("[name=nextBy]:checked")||{}).value||"";
      var rec={truck:form.truck.value,date:form.date.value,type:type,odo:parseFloat(form.odo.value),provider:form.provider.value.trim(),work:form.work.value.trim(),
        nextBy:by,nextDate:by==="Date"?form.nextDate.value:"",nextMiles:by==="Mileage"&&form.nextMiles.value!==""?Number(form.nextMiles.value):null,photos:atts};
      return api("saveMaint",S.pin,m?m.id:"",rec).then(function(){ return m?"Service record updated":"Service logged"; }); },
    onDelete:m&&isAdmin()?function(){ return api("deleteMaint",S.pin,m.id); }:null });
}

function truckForm(id){
  var t=id?truckById(id):null; var image=t?t.image:"";
  var nextId=Math.max.apply(null,[0].concat(S.trucks.map(function(x){return +x.truckId||0;})))+1;
  openSheet({title:t?"Edit truck":"Add truck",
    body:'<div class="field"><label for="tName">Truck name <span class="req">*</span></label><input id="tName" name="name" type="text" value="'+esc(t?t.name:"")+'" placeholder="e.g. 2024 (Rosie)">'+(t?'<div class="hint">Renaming also updates this truck\'s fuel and maintenance rows in the sheet.</div>':'')+'</div>'+
     '<div class="two"><div class="field"><label for="tId">Truck ID</label><input id="tId" name="truckId" type="number" min="0" value="'+esc(t&&t.truckId!=null?t.truckId:nextId)+'"></div>'+
     '<div class="field"><label for="tPlate">License plate</label><input id="tPlate" name="plate" type="text" value="'+esc(t?t.plate:"")+'"></div></div>'+
     '<div class="field"><label for="tVin">VIN</label><input id="tVin" name="vin" type="text" value="'+esc(t?t.vin:"")+'" style="font-family:var(--mono)"></div>'+
     '<div class="field"><label for="tReg">Registration expiration</label><input id="tReg" name="regExp" type="date" value="'+esc(t?t.regExp:"")+'"></div>'+
     '<div class="field"><label for="tPhoto">Truck photo</label><div class="thumbs" id="tThumb"></div><input id="tPhoto" type="file" accept="image/*"><div class="hint" id="tUp"></div></div>',
    after:function(){ function draw(){ $("#tThumb").innerHTML=image?'<img data-photo="'+esc(image)+'" alt="Truck photo" style="width:160px;height:90px">':'<span class="hint">No photo yet.</span>'; hydratePhotos(); } draw();
      var fi=$("#tPhoto"); fi.onchange=function(){ var file=fi.files[0]; if(!file) return; var up=$("#tUp"); up.textContent="Uploading…";
        shrink(file,1600).then(function(d){ return api("uploadPhoto",S.pin,"truck",d).then(function(path){ photoCache[path]=d; image=path; draw(); up.textContent="Photo added. Save to keep it."; }); })
          .catch(function(ex){ up.textContent="Couldn't upload that photo: "+msg(ex); }); }; },
    validate:function(form){ var n=form.name.value.trim(); if(!n) return "Enter a truck name.";
      if(S.trucks.some(function(x){return x.name.toLowerCase()===n.toLowerCase()&&(!t||x.id!==t.id);})) return "Another truck already has that name."; return ""; },
    onSave:function(form){ var rec={name:form.name.value.trim(),truckId:form.truckId.value,plate:form.plate.value.trim(),vin:form.vin.value.trim(),regExp:form.regExp.value,image:image};
      if(t&&S.param===t.id) S.param=rec.name;
      return api("saveTruck",S.pin,t?t.id:"",rec).then(function(){ return t?"Truck updated":"Truck added"; }); } });
}

function userForm(id){
  var u=id?S.users.filter(function(x){return x.id===id;})[0]:null;
  openSheet({title:u?"User":"Add user",
    body:'<div class="field"><label for="uName">Username <span class="req">*</span></label><input id="uName" name="username" type="text" value="'+esc(u?u.username:"")+'"></div>'+
     '<div class="field"><label for="uEmail">Email <span class="req">*</span></label><input id="uEmail" name="email" type="email" value="'+esc(u?u.email:"")+'"></div>'+
     '<div class="field"><label for="uRole">Role</label><select id="uRole" name="role">'+ROLES.map(function(r){return '<option'+(((u&&u.role)||"User")===r?" selected":"")+'>'+r+'</option>';}).join("")+'</select></div>',
    validate:function(form){ if(!form.username.value.trim()) return "Enter a username."; if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(form.email.value.trim())) return "Enter a valid email address."; return ""; },
    onSave:function(form){ return api("saveUser",S.pin,u?u.id:"",{username:form.username.value.trim(),email:form.email.value.trim(),role:form.role.value}).then(function(){ return u?"User updated":"User added"; }); },
    onDelete:u?function(){ return api("deleteUser",S.pin,u.id); }:null });
}

function shrink(file,max){ return new Promise(function(res,rej){
  var r=new FileReader(); r.onerror=function(){rej(new Error("Couldn't read that file."));};
  r.onload=function(){ var img=new Image(); img.onerror=function(){rej(new Error("That file is not an image."));};
    img.onload=function(){ var s=Math.min(1,max/Math.max(img.width,img.height)); var c=document.createElement("canvas");
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",0.82)); };
    img.src=r.result; };
  r.readAsDataURL(file); }); }

/* ---------- navigation ---------- */
function go(view,param){ S.view=view; S.param=param||null; render(); window.scrollTo(0,0); var mn=document.querySelector("main"); if(mn) mn.scrollTop=0; }
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-tab],[data-go],[data-open-truck],[data-edit-fuel],[data-view-maint],[data-edit-maint],[data-edit-truck],[data-edit-user],[data-add-maint],[data-report],[data-r-truck],[data-r-mode],[data-m-truck],[data-m-tab],[data-open-att]");
  if(!el||!S.role) return; var d=el.dataset;
  if(d.openAtt){ if(e.target.closest("[data-remove-att]")) return; e.preventDefault(); openAttachment(d.openAtt); return; }
  if(d.tab){ if(d.tab==="logService"){ maintForm(null,S.view==="truck"?S.param:(S.view==="maint"&&S.mTruck!=="all"?S.mTruck:null)); return; } go(d.tab); return; }
  if(d.addMaint){ maintForm(null,d.addMaint); return; }
  if(d.editTruck){ truckForm(d.editTruck); return; }
  if(d.report){ S.rTruck=d.report; go("reports"); return; }
  if(d.rTruck){ S.rTruck=d.rTruck; render(); return; }
  if(d.rMode){ S.rMode=d.rMode; render(); return; }
  if(d.mTruck){ S.mTruck=d.mTruck; render(); return; }
  if(d.mTab){ S.mTab=d.mTab; render(); return; }
  if(d.openTruck){ go("truck",d.openTruck); return; }
  if(d.go){ go(d.go); return; }
  if(d.editFuel){ fuelForm(d.editFuel); return; }
  if(d.viewMaint){ maintView(d.viewMaint); return; }
  if(d.editMaint){ $("#sheetHost").innerHTML=""; maintForm(d.editMaint); return; }
  if(d.editUser){ userForm(d.editUser); return; }
});

/* ---------- load ---------- */
var loading=false;
function load(quiet){
  if(loading) return Promise.resolve(); loading=true; $("#refreshBtn").classList.add("spin");
  return api("getData",S.pin).then(function(d){ S.role=d.role; S.trucks=d.trucks; S.fuel=d.fuel; S.maint=d.maint; S.users=d.users; S.loaded=true; render(); })
    .catch(function(e){ var m=msg(e); if(/PIN/.test(m)){ store("emsPin",null); S.role=null; showGate(m); } else if(!quiet) toast(m); })
    .then(function(){ loading=false; $("#refreshBtn").classList.remove("spin"); });
}
function showGate(err){ $("#app").hidden=true; $("#gate").hidden=false; var e=$("#gateErr"); e.hidden=!err; e.textContent=err||""; $("#pinInput").value=""; setTimeout(function(){ $("#pinInput").focus(); },50); }
function showApp(){ $("#gate").hidden=true; $("#app").hidden=false; render(); }
$("#gateForm").onsubmit=function(e){ e.preventDefault(); var p=$("#pinInput").value.trim(); if(!p) return;
  var b=$("#gateBtn"); b.disabled=true; b.textContent="Checking…";
  api("login",p).then(function(role){ S.pin=p; S.role=role; store("emsPin",p); showApp(); return load(); })
    .catch(function(err){ showGate(msg(err)); }).then(function(){ b.disabled=false; b.textContent="Unlock"; }); };
$("#refreshBtn").onclick=function(){ load(); };
document.addEventListener("visibilitychange",function(){ if(!document.hidden&&S.role) load(true); });
setInterval(function(){ if(!document.hidden&&S.role) load(true); },180000);

var saved=store("emsPin");
if(saved){ S.pin=saved; S.role="crew"; showApp(); load(); } else showGate();
})();
</script>
</body>
</html>
